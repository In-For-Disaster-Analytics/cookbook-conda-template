#
name: Create and publish a Docker image

# Configures this workflow to run every time a change is pushed to the branch called `release`.
on:
  push:
    branches: "*"
    tags:
      - "*"
  pull_request:
  workflow_dispatch:

# Defines two custom environment variables for the workflow. These are used for the Container registry domain, and a name for the Docker image that this workflow builds.
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_id == '806583770' && 'in-for-disaster-analytics/cookbook-conda-template' || github.repository }}
  LEGACY_IMAGE: ghcr.io/in-for-disaster-analytics/cookbook-conda-template
  CANONICAL_IMAGE: ghcr.io/tacc-decision-support/cookbook-conda-template

# There is a single job in this workflow. It's configured to run on the latest available version of Ubuntu.
jobs:
  build-and-push-image:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Sets the permissions granted to the `GITHUB_TOKEN` for the actions in this job.
    permissions:
      contents: read
      packages: write
      #
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # This step uses [docker/metadata-action](https://github.com/docker/metadata-action#about) to extract tags and labels that will be applied to the specified image. The `id` "meta" allows the output of this step to be referenced in a subsequent step. The `images` value provides the base name for the tags and labels.
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      # This step uses the `docker/build-push-action` action to build the image, based on your repository's `Dockerfile`. If the build succeeds, it pushes the image to GitHub Packages.
      # It uses the `context` parameter to define the build's context as the set of files located in the specified path. For more information, see "[Usage](https://github.com/docker/build-push-action#usage)" in the README of the `docker/build-push-action` repository.
      # It uses the `tags` and `labels` parameters to tag and label the image with the output from the "meta" step.
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build-pr-image:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          version: v0.39.0
      - uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          push: false

  compatibility-build:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.repository_id == '806583770'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: registry-compatibility-pilot
    concurrency:
      group: cookbook-conda-compatibility-build
      cancel-in-progress: false
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      digest: ${{ steps.build.outputs.digest }}
      baseline: ${{ steps.baseline.outputs.baseline }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          version: v0.39.0
      - name: Define unique pilot tag
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          tag="migration-pilot-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Capture legacy consumer-tag baseline anonymously
        id: baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import hashlib, json, os, urllib.parse, urllib.request
          image = os.environ['LEGACY_IMAGE'].removeprefix('ghcr.io/')
          query = urllib.parse.urlencode({'service': 'ghcr.io', 'scope': f'repository:{image}:pull'})
          with urllib.request.urlopen('https://ghcr.io/token?' + query, timeout=30) as r:
              token = json.load(r)['token']
          baseline = {}
          for tag in ['main', 'latest', '0.0.2']:
              req = urllib.request.Request(f'https://ghcr.io/v2/{image}/manifests/{tag}', headers={
                  'Authorization': 'Bearer ' + token,
                  'Accept': 'application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json'})
              with urllib.request.urlopen(req, timeout=30) as r:
                  baseline[tag] = 'sha256:' + hashlib.sha256(r.read()).hexdigest()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('baseline=' + json.dumps(baseline, separators=(',', ':')) + '\n')
          PYCODE
      - name: Log in with approved compatibility identity
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ghcr.io
          username: ${{ vars.GHCR_COMPAT_USERNAME }}
          password: ${{ secrets.GHCR_COMPAT_TOKEN }}
      - name: Build once into the legacy pilot tag
        id: build
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.LEGACY_IMAGE }}:${{ steps.identity.outputs.tag }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Record recovery evidence before the second publication
        if: always() && steps.identity.outcome == 'success'
        env:
          PILOT_TAG: ${{ steps.identity.outputs.tag }}
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
          LEGACY_BASELINE: ${{ steps.baseline.outputs.baseline }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import json, os, pathlib
          result = {key: os.environ.get(key, '') for key in ['GITHUB_REPOSITORY', 'GITHUB_SHA', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'LEGACY_IMAGE', 'CANONICAL_IMAGE', 'PILOT_TAG', 'BUILT_DIGEST', 'BUILD_OUTCOME']}
          result['legacy_baseline'] = json.loads(os.environ.get('LEGACY_BASELINE') or 'null')
          pathlib.Path(os.environ['RUNNER_TEMP'], 'compatibility-recovery.json').write_text(json.dumps(result, indent=2) + '\n')
          PYCODE
      - name: Copy the exact published digest to the canonical pilot tag
        env:
          PILOT_TAG: ${{ steps.identity.outputs.tag }}
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PILOT_TAG" == migration-pilot-* ]]
          [[ "$BUILT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'Legacy artifact: %s@%s\nCanonical tag: %s:%s\n' \
            "$LEGACY_IMAGE" "$BUILT_DIGEST" "$CANONICAL_IMAGE" "$PILOT_TAG" >> "$GITHUB_STEP_SUMMARY"
          docker buildx imagetools create --prefer-index=false \
            --tag "$CANONICAL_IMAGE:$PILOT_TAG" "$LEGACY_IMAGE@$BUILT_DIGEST"
      - name: Retain recovery evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compatibility-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/compatibility-recovery.json
          if-no-files-found: warn
          retention-days: 30

  compatibility-public-check:
    needs: compatibility-build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: registry-compatibility-public-check
    concurrency:
      group: cookbook-conda-compatibility-public-check
      cancel-in-progress: false
    permissions: {}
    env:
      PILOT_TAG: ${{ needs.compatibility-build.outputs.tag }}
      BUILT_DIGEST: ${{ needs.compatibility-build.outputs.digest }}
      LEGACY_BASELINE: ${{ needs.compatibility-build.outputs.baseline }}
    steps:
      - name: Verify both namespaces anonymously and preserve consumer tags
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import hashlib, json, os, pathlib, urllib.parse, urllib.request
          accept = ', '.join(['application/vnd.oci.image.index.v1+json', 'application/vnd.docker.distribution.manifest.list.v2+json', 'application/vnd.oci.image.manifest.v1+json', 'application/vnd.docker.distribution.manifest.v2+json'])
          tag, expected = os.environ['PILOT_TAG'], os.environ['BUILT_DIGEST']
          assert tag.startswith('migration-pilot-')
          results = {}
          def client(image):
              image = image.removeprefix('ghcr.io/')
              query = urllib.parse.urlencode({'service': 'ghcr.io', 'scope': f'repository:{image}:pull'})
              with urllib.request.urlopen('https://ghcr.io/token?' + query, timeout=30) as r:
                  token = json.load(r)['token']
              def manifest(ref):
                  req = urllib.request.Request(f'https://ghcr.io/v2/{image}/manifests/{ref}', headers={'Authorization': 'Bearer ' + token, 'Accept': accept})
                  with urllib.request.urlopen(req, timeout=30) as r:
                      raw = r.read()
                  return 'sha256:' + hashlib.sha256(raw).hexdigest(), json.loads(raw)
              return manifest
          for key in ['LEGACY_IMAGE', 'CANONICAL_IMAGE']:
              fetch = client(os.environ[key])
              digest, body = fetch(tag)
              assert digest == expected, (key, digest, expected)
              seen, pending = set(), list(body.get('manifests', []))
              while pending:
                  descriptor = pending.pop()
                  child = descriptor['digest']
                  if child in seen:
                      continue
                  actual, value = fetch(child)
                  assert actual == child, (key, child, actual)
                  seen.add(child)
                  pending.extend(value.get('manifests', []))
              results[key] = {'image': os.environ[key], 'tag': tag, 'digest': digest, 'child_manifests': sorted(seen)}
          assert results['LEGACY_IMAGE']['child_manifests'] == results['CANONICAL_IMAGE']['child_manifests']
          fetch = client(os.environ['LEGACY_IMAGE'])
          baseline = json.loads(os.environ['LEGACY_BASELINE'])
          for alias, digest in baseline.items():
              actual, _ = fetch(alias)
              assert actual == digest, ('legacy tag changed; investigate concurrent publishing', alias, digest, actual)
          results['legacy_consumer_tag_baseline'] = baseline
          pathlib.Path('compatibility-result.json').write_text(json.dumps(results, indent=2) + '\n')
          print(json.dumps(results, indent=2))
          PYCODE
      - name: Retain successful verification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compatibility-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: compatibility-result.json
          retention-days: 30
